# Defaults for tg-compress.sh. Command-line flags override these.

# Mode: "quality" (fixed CRF, smallest file that still looks good)
#    or "size"    (two-pass encode that fits under TARGET_MB)
MODE="quality"

# quality mode: x264 CRF (18 = near lossless, 23 = default, 28 = small/soft)
CRF=26

# size mode: target size in MB (Telegram Bot API upload limit is 50)
TARGET_MB=50

# Cap the shorter side of the video (720 = 720p). 0 = keep original.
MAX_RES=720

# x264 preset: ultrafast ... medium ... slow ... veryslow (slower = smaller)
PRESET="slow"

# Audio bitrate in kbps
AUDIO_KBPS=128
